name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    # A real PostgreSQL, the production version, for PostgresMigrationsTest: every Flyway
    # migration applied to an empty database and Hibernate validating the entities against it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prudence_migrations
          POSTGRES_USER: prudence
          POSTGRES_PASSWORD: prudence-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prudence -d prudence_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles, runs the whole test suite (in-memory H2, test profile: no Kafka or Ernest
      # needed; the PostgreSQL service only for the migrations) and checks google-java-format
      # (spotless:check is bound to verify).
      - name: Build, test and check formatting
        env:
          PRUDENCE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/prudence_migrations
          PRUDENCE_TEST_POSTGRES_USER: prudence
          PRUDENCE_TEST_POSTGRES_PASSWORD: prudence-ci
        run: mvn -B -ntp verify

  ui:
    name: Console (format, build and e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Check formatting
        working-directory: ui
        run: npm run format:check

      # Type-checks (tsc -b) and bundles.
      - name: Type-check and build
        working-directory: ui
        run: npm run build

      # The console against a mocked API and identity provider: what each governance function
      # sees, no access without one, and a switched identity-provider session ending ours.
      - name: Install Playwright's Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: ui
        run: npm run test:e2e

  adapters:
    name: Python adapters (syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The adapters have no test suite yet: at least every module must compile.
      - name: Compile
        run: python -m compileall -q -x '/\.venv/' integrations

  contract:
    name: Contracts (test vectors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The reference implementation must agree with every vector the apps will run.
      - name: Check the vectors
        run: |
          python -m pip install pyyaml==6.0.2
          python contract/governance/reference/check_vectors.py

      # Every template is a valid model with nothing left uncovered, and the generators run.
      - name: Check the templates and ct-model
        run: |
          for t in contract/governance/templates/*.yaml; do
            python contract/governance/ct-model/ct_model.py check --strict "$t"
          done
          python contract/governance/ct-model/ct_model.py keycloak contract/governance/templates/banking.yaml -o "$RUNNER_TEMP/realm.json"
          python contract/governance/ct-model/ct_model.py entra contract/governance/templates/banking.yaml -o "$RUNNER_TEMP/entra.json"
          python contract/governance/ct-model/ct_model.py explain contract/governance/templates/banking.yaml \
            '{"roles":["ai-internal-audit"]}' | grep -qx "prudence: audit"

      # Decision API: the vectors agree with the README and the OpenAPI schemas, and the Python
      # gate every framework adapter uses agrees with the vectors (Prudence's side runs in
      # DecisionApiContractTest, AOS's in its own CI).
      - name: Check the Decision API vectors and prudence-core's gate
        run: |
          python -m pip install httpx==0.28.1
          python contract/decision/reference/check_vectors.py
          python -m unittest discover -s integrations/prudence-core/tests -v
