name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compiles, runs the whole test suite (in-memory H2, test profile: no database, Kafka or
      # Ernest needed) and checks google-java-format (spotless:check is bound to verify).
      - name: Build, test and check formatting
        run: mvn -B -ntp verify

  ui:
    name: Console (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # Type-checks (tsc -b) and bundles.
      - name: Type-check and build
        working-directory: ui
        run: npm run build

  adapters:
    name: Python adapters (syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The adapters have no test suite yet: at least every module must compile.
      - name: Compile
        run: python -m compileall -q -x '/\.venv/' integrations

  contract:
    name: Governance contract (test vectors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The reference implementation must agree with every vector the apps will run.
      - name: Check the vectors
        run: |
          python -m pip install pyyaml==6.0.2
          python contract/governance/reference/check_vectors.py
