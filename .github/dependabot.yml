# Dependency updates (Dependabot): weekly, minor and patch updates grouped into one pull request
# per ecosystem so the queue stays reviewable; majors arrive one by one. Security updates are
# separate and immediate once Dependabot alerts are enabled in the repository settings.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The console
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Python adapters and runner images. Listed one by one: conformance repeats the adapters' limits
  # with editable paths, which Dependabot cannot follow, and one such path fails the whole job.
  - package-ecosystem: pip
    directories:
      - "/integrations/agent-framework"
      - "/integrations/agno"
      - "/integrations/claude-agent-sdk"
      - "/integrations/crewai"
      - "/integrations/google-adk"
      - "/integrations/langchain"
      - "/integrations/langgraph"
      - "/integrations/llamaindex"
      - "/integrations/openai-agents"
      - "/integrations/prudence-core"
      - "/integrations/pydantic-ai"
      - "/integrations/semantic-kernel"
      - "/integrations/smolagents"
      - "/integrations/strands-agents"
      - "/integrations/demo-runner/images/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: "/loadtest"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - "/"
      - "/ui"
      - "/integrations/demo-runner"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
