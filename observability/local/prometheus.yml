global:
  scrape_interval: 15s

# The suite's service-level objectives (99.5 % over 28 days) and their burn-rate alerts; with no
# Alertmanager here they show in Prometheus's Alerts page.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prudence and Ernest push OTLP to the collector, which exposes it here.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # AOS serves its own /metrics on the host; edit the port if yours is not 8080 (Prometheus does
  # not expand environment variables here).
  - job_name: aos
    static_configs:
      - targets: ["host.docker.internal:8080"]
