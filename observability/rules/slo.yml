# Service-level objectives of the Chestertown suite (contract/observability, section 8):
# 99.5 % over 28 days for every indicator. Generated layout: one recording rule per indicator
# and window (the error ratio, and the number of valid events), then multi-window burn-rate
# alerts on them. Error budget 0.5 %; a burn rate of 1 spends it in exactly 28 days.
#
# Load it in Prometheus next to the other rules (rule_files). The alerts carry `slo` and
# `severity`; Alertmanager routes them like the rest.
groups:
  - name: slo-recording
    rules:
      - record: slo:error_ratio:rate5m
        labels: {slo: f1_availability}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict="ERROR"}[5m]))) / (sum(rate(prudence_decision_duration_seconds_count[5m])))
      - record: slo:events:increase5m
        labels: {slo: f1_availability}
        expr: sum(rate(prudence_decision_duration_seconds_count[5m])) * 300
      - record: slo:error_ratio:rate30m
        labels: {slo: f1_availability}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict="ERROR"}[30m]))) / (sum(rate(prudence_decision_duration_seconds_count[30m])))
      - record: slo:events:increase30m
        labels: {slo: f1_availability}
        expr: sum(rate(prudence_decision_duration_seconds_count[30m])) * 1800
      - record: slo:error_ratio:rate1h
        labels: {slo: f1_availability}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict="ERROR"}[1h]))) / (sum(rate(prudence_decision_duration_seconds_count[1h])))
      - record: slo:events:increase1h
        labels: {slo: f1_availability}
        expr: sum(rate(prudence_decision_duration_seconds_count[1h])) * 3600
      - record: slo:error_ratio:rate5m
        labels: {slo: f1_latency}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[5m])) - sum(rate(prudence_decision_duration_seconds_bucket{verdict!="ERROR",le="0.25"}[5m]))) / (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[5m])))
      - record: slo:events:increase5m
        labels: {slo: f1_latency}
        expr: sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[5m])) * 300
      - record: slo:error_ratio:rate30m
        labels: {slo: f1_latency}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[30m])) - sum(rate(prudence_decision_duration_seconds_bucket{verdict!="ERROR",le="0.25"}[30m]))) / (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[30m])))
      - record: slo:events:increase30m
        labels: {slo: f1_latency}
        expr: sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[30m])) * 1800
      - record: slo:error_ratio:rate1h
        labels: {slo: f1_latency}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[1h])) - sum(rate(prudence_decision_duration_seconds_bucket{verdict!="ERROR",le="0.25"}[1h]))) / (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[1h])))
      - record: slo:events:increase1h
        labels: {slo: f1_latency}
        expr: sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[1h])) * 3600
      - record: slo:error_ratio:rate5m
        labels: {slo: f2_completeness}
        expr: (sum(rate(prudence_delivery_records_total{outcome="dead"}[5m]))) / (sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[5m])))
      - record: slo:events:increase5m
        labels: {slo: f2_completeness}
        expr: sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[5m])) * 300
      - record: slo:error_ratio:rate30m
        labels: {slo: f2_completeness}
        expr: (sum(rate(prudence_delivery_records_total{outcome="dead"}[30m]))) / (sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[30m])))
      - record: slo:events:increase30m
        labels: {slo: f2_completeness}
        expr: sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[30m])) * 1800
      - record: slo:error_ratio:rate1h
        labels: {slo: f2_completeness}
        expr: (sum(rate(prudence_delivery_records_total{outcome="dead"}[1h]))) / (sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[1h])))
      - record: slo:events:increase1h
        labels: {slo: f2_completeness}
        expr: sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[1h])) * 3600
      - record: slo:error_ratio:rate5m
        labels: {slo: f2_freshness}
        expr: (sum(rate(ernest_evidence_chaining_delay_seconds_count[5m])) - sum(rate(ernest_evidence_chaining_delay_seconds_bucket{le="900"}[5m]))) / (sum(rate(ernest_evidence_chaining_delay_seconds_count[5m])))
      - record: slo:events:increase5m
        labels: {slo: f2_freshness}
        expr: sum(rate(ernest_evidence_chaining_delay_seconds_count[5m])) * 300
      - record: slo:error_ratio:rate30m
        labels: {slo: f2_freshness}
        expr: (sum(rate(ernest_evidence_chaining_delay_seconds_count[30m])) - sum(rate(ernest_evidence_chaining_delay_seconds_bucket{le="900"}[30m]))) / (sum(rate(ernest_evidence_chaining_delay_seconds_count[30m])))
      - record: slo:events:increase30m
        labels: {slo: f2_freshness}
        expr: sum(rate(ernest_evidence_chaining_delay_seconds_count[30m])) * 1800
      - record: slo:error_ratio:rate1h
        labels: {slo: f2_freshness}
        expr: (sum(rate(ernest_evidence_chaining_delay_seconds_count[1h])) - sum(rate(ernest_evidence_chaining_delay_seconds_bucket{le="900"}[1h]))) / (sum(rate(ernest_evidence_chaining_delay_seconds_count[1h])))
      - record: slo:events:increase1h
        labels: {slo: f2_freshness}
        expr: sum(rate(ernest_evidence_chaining_delay_seconds_count[1h])) * 3600
      - record: slo:error_ratio:rate5m
        labels: {slo: f3_verifiability}
        expr: (sum(rate(ernest_proof_duration_seconds_count{operation="verify",outcome!="success"}[5m]))) / (sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[5m])))
      - record: slo:events:increase5m
        labels: {slo: f3_verifiability}
        expr: sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[5m])) * 300
      - record: slo:error_ratio:rate30m
        labels: {slo: f3_verifiability}
        expr: (sum(rate(ernest_proof_duration_seconds_count{operation="verify",outcome!="success"}[30m]))) / (sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[30m])))
      - record: slo:events:increase30m
        labels: {slo: f3_verifiability}
        expr: sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[30m])) * 1800
      - record: slo:error_ratio:rate1h
        labels: {slo: f3_verifiability}
        expr: (sum(rate(ernest_proof_duration_seconds_count{operation="verify",outcome!="success"}[1h]))) / (sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[1h])))
      - record: slo:events:increase1h
        labels: {slo: f3_verifiability}
        expr: sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[1h])) * 3600

  # The 6-hour and 3-day windows change slowly and each evaluation reads days of samples: every
  # 2 minutes is enough. Not 5 or more: an instant query sees a series only if its last sample is
  # under 5 minutes old (Prometheus's lookback), and the alerts below would then flicker.
  - name: slo-recording-long
    interval: 2m
    rules:
      - record: slo:error_ratio:rate6h
        labels: {slo: f1_availability}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict="ERROR"}[6h]))) / (sum(rate(prudence_decision_duration_seconds_count[6h])))
      - record: slo:events:increase6h
        labels: {slo: f1_availability}
        expr: sum(rate(prudence_decision_duration_seconds_count[6h])) * 21600
      - record: slo:error_ratio:rate3d
        labels: {slo: f1_availability}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict="ERROR"}[3d]))) / (sum(rate(prudence_decision_duration_seconds_count[3d])))
      - record: slo:events:increase3d
        labels: {slo: f1_availability}
        expr: sum(rate(prudence_decision_duration_seconds_count[3d])) * 259200
      - record: slo:error_ratio:rate6h
        labels: {slo: f1_latency}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[6h])) - sum(rate(prudence_decision_duration_seconds_bucket{verdict!="ERROR",le="0.25"}[6h]))) / (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[6h])))
      - record: slo:events:increase6h
        labels: {slo: f1_latency}
        expr: sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[6h])) * 21600
      - record: slo:error_ratio:rate3d
        labels: {slo: f1_latency}
        expr: (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[3d])) - sum(rate(prudence_decision_duration_seconds_bucket{verdict!="ERROR",le="0.25"}[3d]))) / (sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[3d])))
      - record: slo:events:increase3d
        labels: {slo: f1_latency}
        expr: sum(rate(prudence_decision_duration_seconds_count{verdict!="ERROR"}[3d])) * 259200
      - record: slo:error_ratio:rate6h
        labels: {slo: f2_completeness}
        expr: (sum(rate(prudence_delivery_records_total{outcome="dead"}[6h]))) / (sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[6h])))
      - record: slo:events:increase6h
        labels: {slo: f2_completeness}
        expr: sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[6h])) * 21600
      - record: slo:error_ratio:rate3d
        labels: {slo: f2_completeness}
        expr: (sum(rate(prudence_delivery_records_total{outcome="dead"}[3d]))) / (sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[3d])))
      - record: slo:events:increase3d
        labels: {slo: f2_completeness}
        expr: sum(rate(prudence_delivery_records_total{outcome=~"delivered|dead"}[3d])) * 259200
      - record: slo:error_ratio:rate6h
        labels: {slo: f2_freshness}
        expr: (sum(rate(ernest_evidence_chaining_delay_seconds_count[6h])) - sum(rate(ernest_evidence_chaining_delay_seconds_bucket{le="900"}[6h]))) / (sum(rate(ernest_evidence_chaining_delay_seconds_count[6h])))
      - record: slo:events:increase6h
        labels: {slo: f2_freshness}
        expr: sum(rate(ernest_evidence_chaining_delay_seconds_count[6h])) * 21600
      - record: slo:error_ratio:rate3d
        labels: {slo: f2_freshness}
        expr: (sum(rate(ernest_evidence_chaining_delay_seconds_count[3d])) - sum(rate(ernest_evidence_chaining_delay_seconds_bucket{le="900"}[3d]))) / (sum(rate(ernest_evidence_chaining_delay_seconds_count[3d])))
      - record: slo:events:increase3d
        labels: {slo: f2_freshness}
        expr: sum(rate(ernest_evidence_chaining_delay_seconds_count[3d])) * 259200
      - record: slo:error_ratio:rate6h
        labels: {slo: f3_verifiability}
        expr: (sum(rate(ernest_proof_duration_seconds_count{operation="verify",outcome!="success"}[6h]))) / (sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[6h])))
      - record: slo:events:increase6h
        labels: {slo: f3_verifiability}
        expr: sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[6h])) * 21600
      - record: slo:error_ratio:rate3d
        labels: {slo: f3_verifiability}
        expr: (sum(rate(ernest_proof_duration_seconds_count{operation="verify",outcome!="success"}[3d]))) / (sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[3d])))
      - record: slo:events:increase3d
        labels: {slo: f3_verifiability}
        expr: sum(rate(ernest_proof_duration_seconds_count{operation="verify"}[3d])) * 259200

  - name: slo-burn-rate
    rules:
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate1h{slo="f1_availability"} > 0.072
            and slo:error_ratio:rate5m{slo="f1_availability"} > 0.072
            and slo:events:increase1h{slo="f1_availability"} >= 10
        labels:
          severity: critical
          slo: f1_availability
          service: suite
        annotations:
          summary: "SLO f1_availability is burning its error budget fast ({{ $value | humanizePercentage }} errors over 1h)"
          description: "F1 admission: decisions without a verdict above 14.4x the 0.5 % budget over 1h and 5m: 2 % of the 28-day budget in an hour. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate6h{slo="f1_availability"} > 0.03
            and slo:error_ratio:rate30m{slo="f1_availability"} > 0.03
            and slo:events:increase6h{slo="f1_availability"} >= 10
        labels:
          severity: critical
          slo: f1_availability
          service: suite
        annotations:
          summary: "SLO f1_availability is burning its error budget fast ({{ $value | humanizePercentage }} errors over 6h)"
          description: "F1 admission: decisions without a verdict above 6x the 0.5 % budget over 6h and 30m: 5 % of the 28-day budget in six hours. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOSlowBurn
        expr: |
          slo:error_ratio:rate3d{slo="f1_availability"} > 0.005
            and slo:error_ratio:rate6h{slo="f1_availability"} > 0.005
            and slo:events:increase3d{slo="f1_availability"} >= 10
        labels:
          severity: warning
          slo: f1_availability
          service: suite
        annotations:
          summary: "SLO f1_availability is burning its error budget ({{ $value | humanizePercentage }} errors over 3d)"
          description: "F1 admission: decisions without a verdict above 1x the 0.5 % budget over 3d and 6h: 10 % of the 28-day budget in three days. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate1h{slo="f1_latency"} > 0.072
            and slo:error_ratio:rate5m{slo="f1_latency"} > 0.072
            and slo:events:increase1h{slo="f1_latency"} >= 10
        labels:
          severity: critical
          slo: f1_latency
          service: suite
        annotations:
          summary: "SLO f1_latency is burning its error budget fast ({{ $value | humanizePercentage }} errors over 1h)"
          description: "F1 admission: decisions answered after 250 ms above 14.4x the 0.5 % budget over 1h and 5m: 2 % of the 28-day budget in an hour. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate6h{slo="f1_latency"} > 0.03
            and slo:error_ratio:rate30m{slo="f1_latency"} > 0.03
            and slo:events:increase6h{slo="f1_latency"} >= 10
        labels:
          severity: critical
          slo: f1_latency
          service: suite
        annotations:
          summary: "SLO f1_latency is burning its error budget fast ({{ $value | humanizePercentage }} errors over 6h)"
          description: "F1 admission: decisions answered after 250 ms above 6x the 0.5 % budget over 6h and 30m: 5 % of the 28-day budget in six hours. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOSlowBurn
        expr: |
          slo:error_ratio:rate3d{slo="f1_latency"} > 0.005
            and slo:error_ratio:rate6h{slo="f1_latency"} > 0.005
            and slo:events:increase3d{slo="f1_latency"} >= 10
        labels:
          severity: warning
          slo: f1_latency
          service: suite
        annotations:
          summary: "SLO f1_latency is burning its error budget ({{ $value | humanizePercentage }} errors over 3d)"
          description: "F1 admission: decisions answered after 250 ms above 1x the 0.5 % budget over 3d and 6h: 10 % of the 28-day budget in three days. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate1h{slo="f2_completeness"} > 0.072
            and slo:error_ratio:rate5m{slo="f2_completeness"} > 0.072
            and slo:events:increase1h{slo="f2_completeness"} >= 10
        labels:
          severity: critical
          slo: f2_completeness
          service: suite
        annotations:
          summary: "SLO f2_completeness is burning its error budget fast ({{ $value | humanizePercentage }} errors over 1h)"
          description: "F2 evidence: records dead-lettered above 14.4x the 0.5 % budget over 1h and 5m: 2 % of the 28-day budget in an hour. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate6h{slo="f2_completeness"} > 0.03
            and slo:error_ratio:rate30m{slo="f2_completeness"} > 0.03
            and slo:events:increase6h{slo="f2_completeness"} >= 10
        labels:
          severity: critical
          slo: f2_completeness
          service: suite
        annotations:
          summary: "SLO f2_completeness is burning its error budget fast ({{ $value | humanizePercentage }} errors over 6h)"
          description: "F2 evidence: records dead-lettered above 6x the 0.5 % budget over 6h and 30m: 5 % of the 28-day budget in six hours. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOSlowBurn
        expr: |
          slo:error_ratio:rate3d{slo="f2_completeness"} > 0.005
            and slo:error_ratio:rate6h{slo="f2_completeness"} > 0.005
            and slo:events:increase3d{slo="f2_completeness"} >= 10
        labels:
          severity: warning
          slo: f2_completeness
          service: suite
        annotations:
          summary: "SLO f2_completeness is burning its error budget ({{ $value | humanizePercentage }} errors over 3d)"
          description: "F2 evidence: records dead-lettered above 1x the 0.5 % budget over 3d and 6h: 10 % of the 28-day budget in three days. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate1h{slo="f2_freshness"} > 0.072
            and slo:error_ratio:rate5m{slo="f2_freshness"} > 0.072
            and slo:events:increase1h{slo="f2_freshness"} >= 10
        labels:
          severity: critical
          slo: f2_freshness
          service: suite
        annotations:
          summary: "SLO f2_freshness is burning its error budget fast ({{ $value | humanizePercentage }} errors over 1h)"
          description: "F2 evidence: events chained more than 15 minutes after acceptance above 14.4x the 0.5 % budget over 1h and 5m: 2 % of the 28-day budget in an hour. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOFastBurn
        expr: |
          slo:error_ratio:rate6h{slo="f2_freshness"} > 0.03
            and slo:error_ratio:rate30m{slo="f2_freshness"} > 0.03
            and slo:events:increase6h{slo="f2_freshness"} >= 10
        labels:
          severity: critical
          slo: f2_freshness
          service: suite
        annotations:
          summary: "SLO f2_freshness is burning its error budget fast ({{ $value | humanizePercentage }} errors over 6h)"
          description: "F2 evidence: events chained more than 15 minutes after acceptance above 6x the 0.5 % budget over 6h and 30m: 5 % of the 28-day budget in six hours. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOSlowBurn
        expr: |
          slo:error_ratio:rate3d{slo="f2_freshness"} > 0.005
            and slo:error_ratio:rate6h{slo="f2_freshness"} > 0.005
            and slo:events:increase3d{slo="f2_freshness"} >= 10
        labels:
          severity: warning
          slo: f2_freshness
          service: suite
        annotations:
          summary: "SLO f2_freshness is burning its error budget ({{ $value | humanizePercentage }} errors over 3d)"
          description: "F2 evidence: events chained more than 15 minutes after acceptance above 1x the 0.5 % budget over 3d and 6h: 10 % of the 28-day budget in three days. Objective 99.5 % over 28 days (contract/observability, section 8)."
      - alert: SLOSlowBurn
        expr: |
          slo:error_ratio:rate3d{slo="f3_verifiability"} > 0.005
            and slo:error_ratio:rate6h{slo="f3_verifiability"} > 0.005
            and slo:events:increase3d{slo="f3_verifiability"} >= 3
        labels:
          severity: warning
          slo: f3_verifiability
          service: suite
        annotations:
          summary: "SLO f3_verifiability is burning its error budget ({{ $value | humanizePercentage }} errors over 3d)"
          description: "F3 verifiability: chain checks that did not verify above 1x the 0.5 % budget over 3d and 6h: 10 % of the 28-day budget in three days. Objective 99.5 % over 28 days (contract/observability, section 8)."
