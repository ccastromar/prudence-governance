[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-semantic-kernel"
version = "0.1.0"
description = "Prudence governance adapter for Semantic Kernel: a function invocation filter."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["semantic-kernel>=1.46", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_semantic_kernel"]
