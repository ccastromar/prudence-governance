[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-pydantic"
version = "0.1.0"
description = "Prudence governance adapter for Pydantic AI: the @governed tool decorator."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# prudence-governance (../prudence-core) is installed alongside, from requirements.txt.
dependencies = ["pydantic-ai-slim>=0.0.14", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_pydantic"]
