[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-strands"
version = "0.1.0"
description = "Prudence governance adapter for Strands Agents: a hook provider that gates every tool call."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["strands-agents>=1.62", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_strands"]
