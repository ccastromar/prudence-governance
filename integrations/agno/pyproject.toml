[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-agno"
version = "0.1.0"
description = "Prudence governance adapter for Agno: a tool hook that gates every tool call."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["agno>=3.1", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_agno"]
