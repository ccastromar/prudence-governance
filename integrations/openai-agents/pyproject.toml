[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-openai-agents"
version = "0.1.0"
description = "Prudence governance adapter for the OpenAI Agents SDK: a tool input guardrail."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the framework version below. Until the packages are published, install the core
# first from the same checkout: pip install -e ../prudence-core -e .
dependencies = ["openai-agents>=0.24", "prudence-governance>=0.1,<0.2"]

[tool.setuptools]
packages = ["prudence_openai_agents"]
