[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-openai-agents"
version = "0.1.0"
description = "Prudence governance adapter for the OpenAI Agents SDK: a tool input guardrail."
requires-python = ">=3.10"
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["openai-agents>=0.24", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_openai_agents"]
