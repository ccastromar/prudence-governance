[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-langchain"
version = "0.1.0"
description = "Prudence governance adapter for LangChain agents: create_agent middleware."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["langchain>=1.4", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_langchain"]
