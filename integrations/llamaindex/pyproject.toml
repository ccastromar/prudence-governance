[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-llamaindex"
version = "0.1.0"
description = "Prudence governance adapter for LlamaIndex: a tool wrapper that gates every call."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the framework version below. Until the packages are published, install the core
# first from the same checkout: pip install -e ../prudence-core -e .
dependencies = ["llama-index-core>=0.14", "prudence-governance>=0.1,<0.2"]

[tool.setuptools]
packages = ["prudence_llamaindex"]
