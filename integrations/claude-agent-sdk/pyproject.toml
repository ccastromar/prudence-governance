[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-claude-agent"
version = "0.1.0"
description = "Prudence governance adapter for the Claude Agent SDK: a PreToolUse hook."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the framework version below. Until the packages are published, install the core
# first from the same checkout: pip install -e ../prudence-core -e .
dependencies = ["claude-agent-sdk>=0.2", "prudence-governance>=0.1,<0.2"]

[tool.setuptools]
packages = ["prudence_claude_agent"]
