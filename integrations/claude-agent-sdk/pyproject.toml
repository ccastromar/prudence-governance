[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-claude-agent"
version = "0.1.0"
description = "Prudence governance adapter for the Claude Agent SDK: a PreToolUse hook."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["claude-agent-sdk>=0.2", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_claude_agent"]
