[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-crewai"
version = "0.1.0"
description = "Prudence governance adapter for CrewAI: tool call hooks that gate every tool call."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["crewai>=1.15", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_crewai"]
