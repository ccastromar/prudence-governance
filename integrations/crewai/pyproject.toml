[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-crewai"
version = "0.1.0"
description = "Prudence governance adapter for CrewAI: tool call hooks that gate every tool call."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Tested with the framework version below. Until the packages are published, install the core
# first from the same checkout: pip install -e ../prudence-core -e .
dependencies = ["crewai>=1.15", "prudence-governance>=0.1,<0.2"]

[tool.setuptools]
packages = ["prudence_crewai"]
