[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-langgraph"
version = "0.1.0"
description = "Prudence governance adapter for LangGraph: governed_node and gate_route."
requires-python = ">=3.10"
# prudence-governance (../prudence-core) is installed alongside, from requirements.txt.
dependencies = ["langgraph>=0.2", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_langgraph"]
