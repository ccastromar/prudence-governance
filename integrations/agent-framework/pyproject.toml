[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prudence-agent-framework"
version = "0.1.0"
description = "Prudence governance adapter for Microsoft Agent Framework: function middleware."
requires-python = ">=3.10"
# Tested with the version below. prudence-governance (../prudence-core) is installed alongside:
# pip install -e ../prudence-core
dependencies = ["agent-framework-core>=1.22", "httpx>=0.27"]

[tool.setuptools]
packages = ["prudence_agent_framework"]
