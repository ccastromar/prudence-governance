server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS.  Resolve the backend at request time so a Prudence
  # container recreation (and its new bridge IP) does not leave this UI proxy
  # pointing at the old address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $prudence_upstream http://prudence:8099;
    proxy_pass $prudence_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OpenID AuthZEN: the PDP's discovery document and evaluation endpoints live at the
  # specification's default paths, outside /api/.
  location /access/ {
    set $prudence_upstream http://prudence:8099;
    proxy_pass $prudence_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /.well-known/authzen-configuration {
    set $prudence_upstream http://prudence:8099;
    proxy_pass $prudence_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
