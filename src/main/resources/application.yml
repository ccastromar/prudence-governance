spring:
  application:
    name: prudence
  datasource:
    # Durable by default: an H2 database file under ./data, so the registry and approvals
    # survive restarts (the in-memory DB lost them). Override the three vars to point at a
    # managed database in production (e.g. Postgres) — add its driver and set PRUDENCE_DB_URL;
    # no code changes. AUTO_SERVER lets a second process (a DB tool) attach while the app runs.
    url: ${PRUDENCE_DB_URL:jdbc:h2:file:./data/prudence;AUTO_SERVER=TRUE}
    username: ${PRUDENCE_DB_USER:sa}
    password: ${PRUDENCE_DB_PASSWORD:}
  jpa:
    hibernate:
      # `update` evolves the schema without dropping data across restarts.
      ddl-auto: update
    open-in-view: false

server:
  port: 8099

# Prudence integrations (control plane): the OPA policy engine (PDP sidecar) and Ernest
# (evidence + attestation sealing). Fail-closed when unreachable.
prudence:
  opa:
    base-url: http://127.0.0.1:8181
    decision-path: /v1/data/prudence/allow
  ernest:
    base-url: http://127.0.0.1:3001
    # Credential presented to Ernest (X-Ernest-Api-Key) for reads and evidence writes.
    # Supplied via the environment; blank when Ernest runs with open access.
    api-key: ${PRUDENCE_ERNEST_API_KEY:}
  qtsp:
    # QTSP CSC remote-signing endpoint to qualify-seal evidence (ADR-002 B2). Blank disables
    # sealing (decisions are then only logged). e.g. http://127.0.0.1:4600/csc/sign
    csc-url: ${PRUDENCE_QTSP_CSC_URL:}
