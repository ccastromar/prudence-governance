spring:
  application:
    name: prudence
  datasource:
    # Production is explicit: do not fall back to a local, unauthenticated H2 store.
    url: ${PRUDENCE_DB_URL}
    username: ${PRUDENCE_DB_USER}
    password: ${PRUDENCE_DB_PASSWORD}
  mail:
    # Host/port/credentials come from SPRING_MAIL_HOST, _PORT, _USERNAME, _PASSWORD. These
    # bound every SMTP call well below the delivery lease.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    hibernate:
      # Schema is owned by Flyway (db/migration); Hibernate only checks it matches.
      ddl-auto: validate
    open-in-view: false

server:
  port: 8099

management:
  # Telemetry is pushed over OTLP to the collector; nothing is scraped, so no extra actuator
  # endpoint is exposed. Off unless PRUDENCE_OTEL_ENABLED=true (metrics and traces together).
  otlp:
    metrics:
      export:
        enabled: ${PRUDENCE_OTEL_ENABLED:false}
        url: ${PRUDENCE_OTEL_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${PRUDENCE_OTEL_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    export:
      enabled: ${PRUDENCE_OTEL_ENABLED:false}
    sampling:
      probability: ${PRUDENCE_TRACING_SAMPLING:0.1}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The SMTP relay only carries alert emails, which have their own outbox and retries. An
    # unreachable relay must not mark Prudence unhealthy (and block its deploys) while it
    # still decides, records and governs; undelivered alerts stay visible on their own.
    mail:
      enabled: false

# Prudence integrations (control plane): the OPA policy engine (PDP sidecar) and Ernest
# (evidence + attestation sealing). Fail-closed when unreachable.
prudence:
  governance:
    # Approval expires unless it is deliberately renewed through review.
    approval-validity-days: ${PRUDENCE_APPROVAL_VALIDITY_DAYS:365}
    # The renewal notice is issued this many days before an approval expires; reviewers can
    # renew any time before expiry without the system stopping. A lapsed approval becomes
    # EXPIRED and must be resubmitted.
    review-window-days: ${PRUDENCE_REVIEW_WINDOW_DAYS:30}
    lifecycle-sweep-ms: ${PRUDENCE_LIFECYCLE_SWEEP_MS:3600000}
  incidents:
    # Art. 73 deadlines can be 2 days: check often. "Due" alerts go out 24h before the deadline.
    deadline-check-ms: ${PRUDENCE_INCIDENT_DEADLINE_CHECK_MS:900000}
  alerts:
    # Expiry, renewal and drift alerts go to governance (plus the system owner); dead-lettered
    # evidence and configuration failures go to operations. Comma-separated addresses.
    governance-recipients: ${PRUDENCE_ALERTS_GOVERNANCE_TO:}
    operations-recipients: ${PRUDENCE_ALERTS_OPERATIONS_TO:}
    from: ${PRUDENCE_ALERTS_FROM:prudence@localhost}
    console-url: ${PRUDENCE_CONSOLE_URL:}
    drift-check-ms: ${PRUDENCE_DRIFT_CHECK_MS:900000}
  evidence:
    # How often the delivery worker looks for pending evidence. Decisions (the high-volume
    # stream) only go out on this poll, so it bounds how late they reach the evidence store;
    # reviews, incidents and attestations are also sent right after they are recorded.
    outbox-delay-ms: ${PRUDENCE_EVIDENCE_OUTBOX_DELAY_MS:2000}
    # Transient failures back off exponentially (capped at 1h); at this limit the event is
    # dead-lettered and posture turns RED. Permanent rejections dead-letter immediately.
    max-attempts: ${PRUDENCE_EVIDENCE_MAX_ATTEMPTS:20}
    # Undelivered evidence older than this makes the system AMBER in posture.
    overdue-after-minutes: ${PRUDENCE_EVIDENCE_OVERDUE_AFTER_MINUTES:15}
    # People (reviewers, incident and policy actors) leave Prudence's evidence only as keyed
    # pseudonyms, HMAC-SHA256 under this key (EvidencePseudonyms): the key itself, or a file
    # holding it (a vault or container secret). At least 32 bytes; required outside dev/test.
    # Keep it: the same person must keep the same pseudonym.
    pseudonym-key: ${PRUDENCE_EVIDENCE_PSEUDONYM_KEY:}
    pseudonym-key-file: ${PRUDENCE_EVIDENCE_PSEUDONYM_KEY_FILE:}
  authzen:
    # MCP gateways ask about tool calls (`resource: {type: tool, id: <name>}`). Map each tool to
    # the AI system it acts for; an unmapped tool is refused. Example:
    #   tool-systems:
    #     "[send_customer_letter]": 68bf42c1-7b02-46b7-a7d9-68d696620b8a
    tool-systems: {}
  demo-runner:
    # Internal-only Python runner for the visible Pydantic AI / LangGraph demonstrations. It is
    # blank unless deployed; browsers only call Prudence and never see its shared token.
    base-url: ${PRUDENCE_DEMO_RUNNER_URL:}
    token: ${PRUDENCE_DEMO_RUNNER_TOKEN:}
  opa:
    base-url: http://127.0.0.1:8181
    decision-path: /v1/data/prudence/allow
    # Deployment supplies the immutable bundle identity used to reproduce a decision.
    policy-version: ${PRUDENCE_OPA_POLICY_VERSION:local-dev}
    policy-hash: ${PRUDENCE_OPA_POLICY_HASH:unverified}
  ernest:
    # Reads (posture, drift, proofs). With Ernest split into roles (ERNEST_ROLE), point this at
    # the read replicas and write-base-url at a writer; leave write-base-url blank otherwise.
    base-url: ${PRUDENCE_ERNEST_BASE_URL:http://127.0.0.1:3001}
    write-base-url: ${PRUDENCE_ERNEST_WRITE_BASE_URL:}
    # Credential presented to Ernest (X-Ernest-Api-Key) for reads and evidence writes.
    # Supplied via the environment; blank when Ernest runs with open access.
    api-key: ${PRUDENCE_ERNEST_API_KEY:}
    # How PDP decisions (one per governed agent step) reach Ernest: `direct` appends them via
    # /api/inferences/batch; `ingestor` queues them on Ernest's event-ingestor (Redis Streams);
    # `kafka` publishes them to a topic the ingestor consumes (Ernest ADR-005, the high-volume
    # choice). Ingestor and Kafka are deduped by decision id. Ingestor records carry no qualified seal, so it
    # cannot be combined with a QTSP. Reviews/attestations/incidents always go direct.
    decision-transport: ${PRUDENCE_ERNEST_DECISION_TRANSPORT:direct}
    ingestor-url: ${PRUDENCE_ERNEST_INGESTOR_URL:}
    ingestor-key: ${PRUDENCE_ERNEST_INGESTOR_KEY:}
    # decision-transport=kafka (Ernest ADR-005): the topic Ernest's ingestor consumes.
    kafka-bootstrap-servers: ${PRUDENCE_ERNEST_KAFKA_BOOTSTRAP_SERVERS:}
    kafka-topic: ${PRUDENCE_ERNEST_KAFKA_TOPIC:prudence.decisions}
    # Kafka security. Outside dev/test Prudence refuses to start unless this is SSL or SASL_SSL.
    kafka-security-protocol: ${PRUDENCE_ERNEST_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    kafka-sasl-mechanism: ${PRUDENCE_ERNEST_KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
    kafka-sasl-username: ${PRUDENCE_ERNEST_KAFKA_SASL_USERNAME:}
    kafka-sasl-password: ${PRUDENCE_ERNEST_KAFKA_SASL_PASSWORD:}
    kafka-truststore-location: ${PRUDENCE_ERNEST_KAFKA_TRUSTSTORE_LOCATION:}
    kafka-truststore-password: ${PRUDENCE_ERNEST_KAFKA_TRUSTSTORE_PASSWORD:}
  qtsp:
    # QTSP CSC remote-signing endpoint to qualify-seal evidence (ADR-002 B2). Blank disables
    # sealing (decisions are then only logged). e.g. http://127.0.0.1:4600/csc/sign
    csc-url: ${PRUDENCE_QTSP_CSC_URL:}
