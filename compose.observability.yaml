# Local observability stack for the Chestertown suite (contract/observability): an OpenTelemetry
# Collector, Tempo (traces), Prometheus (metrics) and Grafana, on localhost. For development
# only: no authentication, data lost with the volumes.
#
#   docker compose -f compose.observability.yaml up -d
#
# Then point the apps, however they run (natively or in containers), at the collector:
#
#   AOS, Ernest:  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   Prudence:     PRUDENCE_OTEL_ENABLED=true PRUDENCE_OTEL_ENDPOINT=http://localhost:4318
#
# Grafana on http://localhost:3000 (signed in as an anonymous admin) has Tempo and Prometheus;
# search Tempo by the attribute correlation_id (an AOS task id) to follow one business flow.
# Prometheus also scrapes AOS's /metrics on the host at :8080 (observability/local/prometheus.yml).
# Without Docker, scripts/otlp-sink is the same collector endpoint in one small binary
# (scripts/README.md).
name: chestertown-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/local/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # A fresh named volume is root-owned and Tempo's default user cannot write to it.
    user: "0"
    volumes:
      - ./observability/local/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/local/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [tempo, prometheus]

volumes:
  tempo-data: {}
